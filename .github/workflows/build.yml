name: Build Windows EXE

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "发票金额重命名工具" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 发票金额重命名工具
          path: dist/发票金额重命名工具.exe
