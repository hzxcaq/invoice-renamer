name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "发票金额重命名工具" main.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/发票金额重命名工具.exe
          generate_release_notes: true
